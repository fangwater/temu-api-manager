<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Temu 中台 Excel 数据导入" />
    <title>Excel 数据导入 | Temu 中台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-row">
          <div class="brand-mark">T</div>
          <div class="brand-copy"><strong>Temu Console</strong><span>数据中台</span></div>
          <button class="icon-button sidebar-close" id="sidebar-close" aria-label="关闭导航" title="关闭导航">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M19 5v14"/></svg>
          </button>
        </div>
        <nav class="navigation" aria-label="主导航">
          <div class="nav-group">
            <div class="nav-label">总览</div>
            <button class="nav-item" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
              <span>工作台</span>
            </button>
          </div>
          <div class="nav-group">
            <div class="nav-label">数据中心</div>
            <button class="nav-item active">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14a2 2 0 0 0 2-2v-3"/><path d="M3 16v3a2 2 0 0 0 2 2"/></svg>
              <span>Excel 数据导入</span>
            </button>
          </div>
          <div class="nav-group">
            <div class="nav-label">订单中心</div>
            <button class="nav-item" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></svg>
              <span>订单查询</span><span class="soon">待启用</span>
            </button>
          </div>
        </nav>
        <div class="sidebar-footer">
          <div class="service-state"><span class="status-dot checking" id="sidebar-dot"></span><span id="sidebar-state">正在检查服务</span></div>
          <button class="nav-item" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.6h.1A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.38.33.72.6 1 .3.28.7.42 1.1.4h.1v4h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg>
            <span>系统设置</span>
          </button>
        </div>
      </aside>

      <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="关闭导航"></button>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-menu" id="mobile-menu" aria-label="打开导航" title="打开导航">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="breadcrumb"><span>数据中心</span><b>/</b><strong>Excel 数据导入</strong></div>
          </div>
          <div class="profile"><div class="avatar">TM</div><span>管理员</span></div>
        </header>

        <main class="main-content">
          <section class="page-heading">
            <div><h1>Excel 数据导入</h1><p>上传并读取业务原始文件，等待分析规则确认</p></div>
            <div class="heading-status"><span class="status-dot checking" id="heading-dot"></span><span id="heading-state">正在检查连接</span></div>
          </section>

          <section class="upload-panel">
            <div class="section-heading">
              <div><span class="step-number">1</span><h2>选择 Excel 文件</h2></div>
              <span class="file-rule">仅支持 .xlsx，最大 50 MB</span>
            </div>
            <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入 Excel 文件">
              <div class="upload-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14a2 2 0 0 0 2-2v-3"/><path d="M3 15v3a2 2 0 0 0 2 2"/></svg>
              </div>
              <div class="dropzone-copy"><strong>拖拽 Excel 文件到这里</strong><span>文件上传后将安全保存在本机，等待后续分析</span></div>
              <button class="primary-button" id="choose-button" type="button">选择文件</button>
              <input id="file-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
            </div>
            <div class="upload-progress" id="upload-progress" hidden>
              <div><span id="progress-name">正在上传</span><strong id="progress-percent">0%</strong></div>
              <div class="progress-track"><span id="progress-bar"></span></div>
            </div>
            <div class="message" id="message" hidden></div>
          </section>

          <section class="history-section">
            <div class="history-header">
              <div><h2>已上传文件</h2><p>完成读取后，请告诉我需要如何分析</p></div>
              <button class="icon-button refresh-button" id="refresh-button" aria-label="刷新列表" title="刷新列表">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
              </button>
            </div>
            <div class="empty-state" id="empty-state">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h4"/></svg>
              <strong>还没有上传文件</strong><span>上传后会在这里显示读取结果</span>
            </div>
            <div class="table-wrap" id="table-wrap" hidden>
              <table class="data-table">
                <thead><tr><th>文件名</th><th>工作表</th><th>数据规模</th><th>文件大小</th><th>上传时间</th><th>状态</th></tr></thead>
                <tbody id="upload-list"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
