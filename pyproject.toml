[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temu-api-manager"
version = "0.1.0"
description = "Temu Open API client and order manager"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
]

[project.scripts]
temu-manager = "temu_api_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
