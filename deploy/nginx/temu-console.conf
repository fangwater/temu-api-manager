location = /temu {
    return 301 /temu/;
}

location = /temu/healthz {
    proxy_pass http://127.0.0.1:18082/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /temu/api/uploads {
    client_max_body_size 51m;
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:18082/api/uploads;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location = /temu/activity-prices {
    return 302 /pangu-sales/?view=activity-prices;
}

location ^~ /temu/activity-prices/ {
    return 302 /pangu-sales/?view=activity-prices;
}

location = /temu/api/marketing/effective-prices {
    return 404;
}

location ^~ /temu/ {
    proxy_pass http://127.0.0.1:18082/temu/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
